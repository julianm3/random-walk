[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "random-walk"
version = "0.2.6"
description = "Interactive 1D random walk explorer with histograms and animations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# For the scripts in tools/ (font exploration), not the package itself.
tools = [
    "dearpygui>=2.0",
    "fonttools>=4.40",
]

[project.scripts]
random-walk = "random_walk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/random_walk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
# Optional: py -m pip install mypy && py -m mypy
files = ["src"]
ignore_missing_imports = true
